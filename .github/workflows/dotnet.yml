name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Release notes live in CHANGELOG.md at the repo root, not here. Nothing in this workflow ever
  # read them -- there is no PackageReleaseNotes and no read-back -- so they were prose parked in a CI
  # file, and the reason given for the location (a double hyphen is illegal inside an XML comment) was
  # only ever an argument against putting them in the csproj.
  # The version NUMBER stays in src/Directory.Build.props (VersionMajorMinor), which the build job
  # reads back rather than restating, so a package cannot declare a version the notes disagree with.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    # Every job is bounded. GitHub's default is 6 hours, which is how an unreachable apt archive
    # parked webview-smoke-linux for an afternoon; healthy runs here are minutes, so a job over
    # these limits is stuck rather than slow.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Published for the test job, so the version is resolved ONCE per run rather than each job
    # re-deriving it.
    outputs:
      version-prefix: ${{ steps.version.outputs.prefix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      id: version
      # Read the version back from the one place it is written (src/Directory.Build.props) instead of
      # restating it here — CI stamps -p:Version across every package, so a hard-coded copy here could
      # ship packages whose version disagrees with the one they declare. -getProperty only EVALUATES
      # the file: nothing is built and no restore is needed, so this can run before restore.
      # The value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow env) keeps
      # the SDK first-run banner out — this is the job's first dotnet call — and the shape check makes
      # anything else unexpected, or a renamed property, fail the run rather than quietly stamping
      # every package ".<run>".
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
    - name: Install Android workload
      # The package multi-targets net10.0-android (SdlVulkanActivity host); restore resolves all TFMs,
      # so it needs the android workload. ubuntu runners already ship the Android SDK + JDK.
      run: dotnet workload install android
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  # BlendOpRegressionTests catch the dangling-pAttachments bug fixed in 3.4.471 by
  # round-tripping VkBlendOp.Min / Max through actual draw calls. Need a Vulkan ICD on the
  # runner; Mesa lavapipe (software) is the standard headless choice. fail-fast: false so a
  # regression on one architecture doesn't mask the other.
  #
  # vulkan-validationlayers is installed too so SyncValidationGlyphFloodTests runs (not skips):
  # it renders an SDF glyph flood offscreen under VK_LAYER_KHRONOS_validation with SYNCHRONIZATION
  # validation on and asserts no read-after-write hazard. Sync validation flags the atlas
  # upload/sample hazard STATICALLY, so lavapipe reproduces it deterministically where the vendor
  # hang (Adreno) never would. timeout-minutes bounds a genuine wedge (the test has its own
  # 60s in-process deadman on top).
  test:
    needs: build
    timeout-minutes: 15
    # Inherited from the build job rather than resolved again — same run, same version.
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: SharpAstro/cache-apt-pkgs-action@v1
      with:
        packages: mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
        version: 1.1
    # If the loader can't enumerate at least one ICD, the tests will Assert.Skip via
    # TryCreateOffscreenContext rather than fail. This diagnostic surfaces that situation
    # (and whether the validation layer is present, for the sync-validation test) in the build
    # log without a re-run.
    - name: Vulkan ICD + layer summary
      run: |
        vulkaninfo --summary || true
        echo "--- instance layers ---"
        vulkaninfo 2>/dev/null | grep -iA1 "VK_LAYER_KHRONOS_validation" || echo "validation layer NOT visible to loader"
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install Android workload
      # The package multi-targets net10.0-android (SdlVulkanActivity host); restore resolves all TFMs,
      # so it needs the android workload. ubuntu runners already ship the Android SDK + JDK.
      run: dotnet workload install android
    - name: Restore dependencies
      run: dotnet restore
    - name: Build test project
      # Only the test project (net10.0) — NOT the whole solution: building the net10.0-android TFM needs
      # the Android SDK, which the ubuntu-24.04-arm runner doesn't ship (ubuntu-latest x64 does). The
      # tests are net10.0 offscreen Vulkan, so the android TFM is irrelevant here (the build job packs it).
      run: dotnet build src/SdlVulkan.Renderer.Tests -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test src/SdlVulkan.Renderer.Tests -c $BUILD_CONF --no-build --logger "console;verbosity=detailed"

  # Headless functional smoke for the Linux WebView backend (GtkWebView / WebKitGTK). Runs two
  # network-free self-tests (tools/WebViewSmoke) inside a real SDL X11 window under Xvfb: `assert`
  # (two-way messaging: page->host + host->page + navigation + JS execution) and `assert-autosize`
  # (the WebViewContentSizer content->host channel). Each exits 0/1 deterministically (it _exit()s
  # past WebKitGTK's atexit teardown, which otherwise aborts with 134). The harness SKIPs (exit 0)
  # when the display / WebKitGTK / Vulkan stack is
  # unavailable, mirroring BlendOpRegressionTests' Assert.Skip-on-no-ICD. Non-gating for now (not
  # in publish-nuget's needs) until proven stable across runners. If a runner's Mesa does not
  # auto-fall-back to software, add LIBGL_ALWAYS_SOFTWARE=1 + WEBKIT_DISABLE_DMABUF_RENDERER=1 below.
  webview-smoke-linux:
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    # Plain apt-get (not cache-apt-pkgs-action): the cache action installs only the named packages
    # without their dependencies, so mesa-vulkan-drivers landed without the driver libs its ICD needs
    # -> "vkCreateInstance: Found no drivers" (-9). apt-get resolves dependencies and installs the ICD.
    # Cached, so the common path needs no network at all -- which is the actual fix. Bounding the
    # apt-get (the previous commit) stopped a wedged mirror costing six hours, but it still wedged:
    # on PR #81 this step stalled on libjavascriptcoregtk-4.1-0 (8.1 MB) twice in a row on
    # ubuntu-latest while the aarch64 twin installed the same set in 1m9s, so the retry only ever
    # bought a slower failure. A cache hit skips the archive entirely; a miss is still bounded and
    # retried, so the worst case is no worse than before.
    #
    # NOT cache-apt-pkgs-action (which `test` above uses): it installs only the named packages
    # without their dependencies, which is how mesa-vulkan-drivers previously landed without the
    # driver libs its ICD needs -> "vkCreateInstance: Found no drivers" (-9). The composite action
    # downloads the resolved dependency closure and dpkg's it, so it keeps apt's resolution.
    - name: Install WebKitGTK + software Vulkan + Xvfb
      uses: ./.github/actions/apt-install
      with:
        cache-name: webview
        packages: mesa-vulkan-drivers libvulkan1 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install Android workload
      # WebViewSmoke references the renderer, whose restore resolves the net10.0-android TFM.
      run: dotnet workload install android
    - name: WebView messaging self-test (headless via Xvfb)
      run: >-
        xvfb-run -a -s "-screen 0 1280x800x24"
        env SDL_VIDEODRIVER=x11
        dotnet run --project tools/WebViewSmoke/WebViewSmoke.csproj -f net10.0 -c $BUILD_CONF assert
    - name: WebView content-sizer self-test (headless via Xvfb)
      # Exercises WebViewContentSizer: the page reports its content height (content->host), and the
      # assert proves the height shrinks below the initial once the box is shrunk — i.e. shrink-to-fit
      # below the webview viewport works. Same skip-on-no-GUI / deterministic-exit semantics as above.
      run: >-
        xvfb-run -a -s "-screen 0 1280x800x24"
        env SDL_VIDEODRIVER=x11
        dotnet run --project tools/WebViewSmoke/WebViewSmoke.csproj -f net10.0 -c $BUILD_CONF assert-autosize

  publish-nuget:
    timeout-minutes: 15
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
